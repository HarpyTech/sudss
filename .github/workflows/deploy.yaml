name: Deploy to Cloud Run

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-format:
    name: 🧹 Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Linting Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Run Flake8 (Linting)
        run: flake8 . --max-line-length=100

      - name: Run Black (Check Format)
        run: black . --check

  deploy:
    name: 🚀 Deploy to Cloud Run
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: lint-and-format

    permissions:
      contents: write   # needed to push tags

    env:
      REGION: us-central1
      PROJECT_ID: "${{ secrets.GCP_PROJECT_ID }}"
      GOOGLE_AI_API_KEY: "${{ secrets.GOOGLE_AI_API_KEY }}"

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # fetch tags for versioning

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Bump version and create Git tag (Prod only)
        if: github.ref_name == 'main'
        id: version
        uses: anothrNick/github-tag-action@1.67.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: true   # produces v1.0.0 style tags

      - name: Set Deployment Variables
        id: vars
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            TAG_NAME=${{ steps.version.outputs.new_tag }}
            echo "SERVICE_NAME=sudss-app" >> $GITHUB_ENV
            echo "IMAGE_TAG=${TAG_NAME}" >> $GITHUB_ENV
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
          else
            LAST_TAG=$(git describe --tags --abbrev=0 || echo "v0.0.0")
            SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
            SNAPSHOT_TAG="${LAST_TAG}-snapshot-${SHORT_SHA}"
            echo "SERVICE_NAME=sudss-dev" >> $GITHUB_ENV
            echo "IMAGE_TAG=${SNAPSHOT_TAG}" >> $GITHUB_ENV
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          fi

      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME=gcr.io/$PROJECT_ID/$SERVICE_NAME:$IMAGE_TAG
          gcloud builds submit --tag $IMAGE_NAME
          # maintain rolling latest
          gcloud container images add-tag $IMAGE_NAME \
            gcr.io/$PROJECT_ID/$SERVICE_NAME:$ENVIRONMENT-latest --quiet

      - name: Deploy to Cloud Run
        run: |
          IMAGE_NAME=gcr.io/$PROJECT_ID/$SERVICE_NAME:$IMAGE_TAG
          gcloud run deploy $SERVICE_NAME \
            --image $IMAGE_NAME \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --set-env-vars ENV=$ENVIRONMENT,GOOGLE_AI_API_KEY=$GOOGLE_AI_API_KEY
